[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolution-engine"
version = "2.0.1"
description = "Local, reproducible neural evolution research laboratory"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
accelerate = ["numba>=0.61"]

[project.scripts]
evolution-engine = "evolution_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evolution_engine = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
